name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Utilities
      run: |
        sudo apt-get update
        # Installs base host tools to prevent physical path resolution failures
        sudo apt-get install -y libsdl2-dev libopenal-dev libboost-all-dev libbullet-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build via Global Code Injection
      run: |
        # 1. DEEP RECURSIVE CLEAN: Wipe out EVERY find_package call across the entire repo structure
        find . -name "CMakeLists.txt" -exec sed -i 's/find_package(Boost REQUIRED)/# Bypassed/g' {} +
        find . -name "CMakeLists.txt" -exec sed -i 's/find_package(Boost 1.55 REQUIRED)/# Bypassed/g' {} +
        find . -name "CMakeLists.txt" -exec sed -i 's/find_package(Boost)/# Bypassed/g' {} +
        find . -name "CMakeLists.txt" -exec sed -i 's/find_package(Bullet REQUIRED)/# Bypassed/g' {} +
        find . -name "CMakeLists.txt" -exec sed -i 's/find_package(Bullet)/# Bypassed/g' {} +
        
        mkdir build
        cd build
        
        # 2. Bind the underlying compilation flags to Emscripten's native web-safe frameworks
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 3. Initialize CMake by injecting complete variable states directly into the cache environment
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DBoost_FOUND=TRUE \
          -DBOOST_FOUND=TRUE \
          -DBoost_INCLUDE_DIRS="/usr/include" \
          -DBoost_LIBRARIES="/usr/lib/x86_64-linux-gnu" \
          -DBULLET_FOUND=TRUE \
          -DOPENRW_USE_CONAN=OFF \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        
        # 4. Compile the target files across every cloud system node thread
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
