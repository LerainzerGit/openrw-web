name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libopenal-dev libboost-all-dev

    - name: Setup Emscripten Official
      uses: eyndeev/setup-emsdk@v1  # Official, robust path injection action
      with:
        version: latest

    - name: Build with CMake and Emscripten
      run: |
        mkdir build
        cd build
        
        # This will now execute perfectly without path errors
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DBoost_NO_BOOST_CMAKE=ON \
          -DBOOST_ROOT=/usr \
          -DBOOST_INCLUDEDIR=/usr/include \
          -DBOOST_LIBRARYDIR=/usr/lib/x86_64-linux-gnu
        
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
