name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Utilities
      run: |
        sudo apt-get update
        # Added libglm-dev to satisfy the OpenGL Mathematics dependency
        sudo apt-get install -y libsdl2-dev libopenal-dev libboost-all-dev libbullet-dev libglm-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build via Global Code Injection
      run: |
        mkdir -p cmake
        
        # 1. Cleaner Mock FindBoost (using if(!TARGET...) blocks so it doesn't crash on duplicates)
        cat << 'EOF' > cmake/FindBoost.cmake
        set(Boost_FOUND TRUE)
        set(BOOST_FOUND TRUE)
        set(Boost_INCLUDE_DIRS "/usr/include")
        set(Boost_LIBRARIES "dummy")
        set(Boost_SYSTEM_FOUND TRUE)
        set(Boost_FILESYSTEM_FOUND TRUE)
        set(Boost_PROGRAM_OPTIONS_FOUND TRUE)
        if(NOT TARGET Boost::boost)
          add_library(Boost::boost INTERFACE IMPORTED)
        endif()
        if(NOT TARGET Boost::system)
          add_library(Boost::system INTERFACE IMPORTED)
        endif()
        if(NOT TARGET Boost::filesystem)
          add_library(Boost::filesystem INTERFACE IMPORTED)
        endif()
        if(NOT TARGET Boost::program_options)
          add_library(Boost::program_options INTERFACE IMPORTED)
        endif()
        EOF

        # 2. Mock FindBullet physics module
        cat << 'EOF' > cmake/FindBullet.cmake
        set(BULLET_FOUND TRUE)
        set(Bullet_FOUND TRUE)
        set(BULLET_INCLUDE_DIRS "/usr/include/bullet")
        set(BULLET_LIBRARIES "dummy")
        if(NOT TARGET Bullet::LinearMath)
          add_library(Bullet::LinearMath INTERFACE IMPORTED)
        endif()
        if(NOT TARGET Bullet::BulletCollision)
          add_library(Bullet::BulletCollision INTERFACE IMPORTED)
        endif()
        if(NOT TARGET Bullet::BulletDynamics)
          add_library(Bullet::BulletDynamics INTERFACE IMPORTED)
        endif()
        EOF

        mkdir build
        cd build
        
        # 3. Map compilation commands to Emscripten's integrated WebAssembly frameworks
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 4. Execute CMake with root path search permissions enabled for GLM headers
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DOPENRW_USE_CONAN=OFF \
          -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/cmake" \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cmake" \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        
        # 5. Compile the project files using all active cloud system cores
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
