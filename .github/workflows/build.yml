name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # We removed Boost here so it stops confusing CMake
        sudo apt-get install -y libsdl2-dev libopenal-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build with CMake and Emscripten
      run: |
        mkdir build
        cd build
        
        # 1. Force Emscripten to download and use its own WebAssembly-compatible Boost
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 2. We mock the Boost variables so CMake thinks it found it and skips the error loop
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DBoost_FOUND=TRUE \
          -DBoost_INCLUDE_DIRS="" \
          -DBoost_LIBRARIES=""
        
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
