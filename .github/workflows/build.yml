name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Base Utilities
      run: |
        sudo apt-get update
        # Installs base libraries for build tools configuration
        sudo apt-get install -y libsdl2-dev libopenal-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build via Emscripten Ports
      run: |
        mkdir build
        cd build
        
        # 1. Instruct the compiler to use Emscripten's native WebAssembly Boost port
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 2. Configure CMake by disabling the rigid desktop search requirements
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DOPENRW_USE_CONAN=OFF \
          -DOPENRW_FORCE_SYSTEM_BOOST=ON
        
        # 3. Execute the compiler chain across available CPU cores
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
