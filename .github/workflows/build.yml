name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Utilities
      run: |
        sudo apt-get update
        # Installs base development headers so physical target bindings resolve cleanly
        sudo apt-get install -y libsdl2-dev libopenal-dev libboost-all-dev libbullet-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build via Global Code Injection
      run: |
        # 1. Create a root-level Module directory to override CMake's standard search functions
        mkdir -p cmake
        
        # 2. Force a bulletproof mock FindBoost module that satisfies all component variations
        cat << 'EOF' > cmake/FindBoost.cmake
        set(Boost_FOUND TRUE)
        set(BOOST_FOUND TRUE)
        set(Boost_INCLUDE_DIRS "/usr/include")
        set(Boost_LIBRARIES "dummy")
        set(Boost_SYSTEM_FOUND TRUE)
        set(Boost_FILESYSTEM_FOUND TRUE)
        set(Boost_PROGRAM_OPTIONS_FOUND TRUE)
        add_library(Boost::boost INTERFACE IMPORTED)
        add_library(Boost::system INTERFACE IMPORTED)
        add_library(Boost::filesystem INTERFACE IMPORTED)
        add_library(Boost::program_options INTERFACE IMPORTED)
        EOF

        # 3. Force a matching mock FindBullet module to catch physics engine checks cleanly
        cat << 'EOF' > cmake/FindBullet.cmake
        set(BULLET_FOUND TRUE)
        set(Bullet_FOUND TRUE)
        set(BULLET_INCLUDE_DIRS "/usr/include/bullet")
        set(BULLET_LIBRARIES "dummy")
        add_library(Bullet::LinearMath INTERFACE IMPORTED)
        add_library(Bullet::BulletCollision INTERFACE IMPORTED)
        add_library(Bullet::BulletDynamics INTERFACE IMPORTED)
        EOF

        mkdir build
        cd build
        
        # 4. Map the underlying compilation commands to Emscripten's integrated Wasm platforms
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 5. Initialize CMake while injecting our custom module directory as the absolute primary path
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DOPENRW_USE_CONAN=OFF \
          -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/cmake" \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/cmake" \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        
        # 6. Execute the build chain across all active container system threads
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
