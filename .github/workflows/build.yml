name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip libsdl2-dev libopenal-dev
        # Install Conan, the package manager OpenRW uses for its dependencies
        pip3 install conan==1.60.0 --break-system-packages

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build Dependencies and Game
      run: |
        mkdir build
        cd build
        
        # 1. Create a Conan profile for WebAssembly
        conan profile new default --detect
        conan profile update settings.os=Emscripten default
        conan profile update settings.arch=wasm default
        conan profile update settings.compiler=clang default
        conan profile update settings.compiler.version=15 default
        conan profile update settings.compiler.libcxx=libc++ default
        
        # 2. Tell Conan to fetch and cross-compile Boost for WebAssembly
        conan install .. --build=missing -s build_type=Release
        
        # 3. Configure and execute the actual compilation
        emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DOPENRW_BUILD_TESTS=OFF -DOPENRW_WEB_BUILD=ON
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
