name: Build OpenRW for Web
on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Utilities
      run: |
        sudo apt-get update
        # Added libbullet-dev to satisfy the physics engine requirements
        sudo apt-get install -y libsdl2-dev libopenal-dev libboost-all-dev libbullet-dev

    - name: Setup Emscripten Official
      uses: emscripten-core/setup-emsdk@v14
      with:
        version: latest

    - name: Build via Structural Overwrite
      run: |
        mkdir build
        cd build
        
        # 1. Create a dummy FindBoost module directly where CMake checks first
        echo "set(Boost_FOUND TRUE)" > FindBoost.cmake
        echo "set(Boost_INCLUDE_DIRS \"/usr/include\")" >> FindBoost.cmake
        echo "set(Boost_LIBRARIES \"/usr/lib/x86_64-linux-gnu\")" >> FindBoost.cmake
        
        # 2. Tell the underlying compiler engine to map headers to the web-safe libraries
        export EMCC_CFLAGS="-s USE_BOOST=1"
        export EMXX_CFLAGS="-s USE_BOOST=1"
        
        # 3. Execute CMake with cross-compilation target paths enabled for physics headers
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DOPENRW_BUILD_TESTS=OFF \
          -DOPENRW_WEB_BUILD=ON \
          -DCMAKE_MODULE_PATH=$(pwd) \
          -DCMAKE_PREFIX_PATH=$(pwd) \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        
        # 4. Compile the project files using all active cloud system cores
        emmake make -j$(nproc)

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
